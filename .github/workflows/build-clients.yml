name: PairDrop Fork • tests and Apple Silicon
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'AGENTS.md', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: JavaScript syntax
        run: find public/scripts -name '*.js' -not -path '*/libs/*' -exec node --check '{}' ';'
  macos:
    needs: regressions
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build native arm64 app and Share extension
        run: bash macos/build.sh
      - name: Verify native disk handling
        run: |
          xcrun swiftc -swift-version 5 macos/Sources/LocalServer.swift macos/Sources/ReceiveStore.swift macos/Tests/main.swift -o build/macos/native-tests
          build/macos/native-tests
      - name: Verify native Services, menu sending, stale pairing recovery and background reception
        run: '"build/macos/PairDrop Fork.app/Contents/MacOS/PairDropFork" --self-test'
      - name: Package one distributable
        run: |
          cd build/macos
          mkdir package
          mv "PairDrop Fork.app" INSTALL_RU.txt package/
          ditto -c -k --sequesterRsrc --keepParent package/PairDrop\ Fork.app PairDrop-Fork-M1-Clipboard-v4.zip
          zip -j PairDrop-Fork-M1-Clipboard-v4.zip package/INSTALL_RU.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PairDrop-Fork-M1-Clipboard-v4
          path: build/macos/PairDrop-Fork-M1-Clipboard-v4.zip
          if-no-files-found: error
          retention-days: 30
  android:
    needs: regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 17 SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Build clipboard client and instrumentation
        run: gradle -p android :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android 17 background clipboard and selected-text menu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/test-device.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PairDrop-Fork-Android17-Clipboard-v4-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android17-test-diagnostics
          path: android/instrumentation.log
