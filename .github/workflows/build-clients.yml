name: PairDrop Fork • tests and Apple Silicon
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'AGENTS.md', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: JavaScript syntax
        run: find public/scripts -name '*.js' -not -path '*/libs/*' -exec node --check '{}' ';'
  macos:
    needs: regressions
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build native arm64 app and Share extension
        run: bash macos/build.sh
      - name: Verify native disk handling
        run: |
          xcrun swiftc -swift-version 5 macos/Sources/LocalServer.swift macos/Sources/ReceiveStore.swift macos/Tests/main.swift -o build/macos/native-tests
          build/macos/native-tests
      - name: Verify native Services, menu sending, stale pairing recovery and background reception
        run: '"build/macos/PairDrop Fork.app/Contents/MacOS/PairDropFork" --self-test'
      - name: Package one distributable
        run: |
          cd build/macos
          mkdir package
          mv "PairDrop Fork.app" INSTALL_RU.txt package/
          ditto -c -k --sequesterRsrc --keepParent package/PairDrop\ Fork.app PairDrop-Fork-M1-Context-Send-Fix-v3.zip
          zip -j PairDrop-Fork-M1-Context-Send-Fix-v3.zip package/INSTALL_RU.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PairDrop-Fork-M1-Context-Send-Fix-v3
          path: build/macos/PairDrop-Fork-M1-Context-Send-Fix-v3.zip
          if-no-files-found: error
          retention-days: 30
