plugins { id 'com.android.application' }
android {
    namespace 'site.landco.pairdrop.fork'
    compileSdk { version = release(37) { minorApiLevel = 0 } }
    buildToolsVersion '37.0.0'
    defaultConfig {
        applicationId 'site.landco.pairdrop.fork'
        minSdk 35
        targetSdk 37
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'site.landco.pairdrop.fork.ClipboardInstrumentation'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDirs += [layout.buildDirectory.dir('generated/web-assets')]
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
tasks.register('bundleWeb', Sync) {
    from('../../public') { into 'web' }
    from('../../LICENSE') { rename { 'LICENSE.txt' } }
    into layout.buildDirectory.dir('generated/web-assets')
}
tasks.named('preBuild').configure { dependsOn 'bundleWeb' }
